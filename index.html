<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 待办清单 + 随手记</title>
<style>
:root{--ink:#2b2f3a;--soft:#9aa0ad;--line:#e6e9f0;--brand:#8ed3cc;--brand-deep:#66b9b1;--shadow:0 8px 30px rgba(40,50,80,.12);--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f5f7fb,#eef1f8);color:var(--ink);min-height:100vh;padding:22px 16px;display:flex;justify-content:center}
.app{width:100%;max-width:1200px;display:flex;gap:22px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.col.side{flex:none;width:620px;display:flex;flex-direction:row;align-items:stretch;gap:12px}

/* 待办清单 */
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px;display:flex;flex-direction:column;height:62vh;overflow:hidden}
.list h2{font-size:19px;display:flex;align-items:center;gap:7px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.io-btns{display:flex;gap:6px;flex:none}
.io-btn{border:1px solid var(--line);background:#f5f7fb;color:var(--brand-deep);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.io-btn:hover{background:#e6ebf3;border-color:var(--brand-deep)}
.add{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:14px;outline:none;font-family:inherit}
.add:focus{border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(102,185,177,.18)}
.items{list-style:none;margin-top:14px;flex:1;min-height:0;overflow:auto}
.items:empty::after{content:"还没有待办，上面写一条吧";display:block;text-align:center;color:var(--soft);font-size:13px;padding:18px 0}
.item,.sub{padding:10px 6px;border-bottom:1px dashed var(--line)}
.item .row,.sub .row{display:flex;align-items:center;gap:10px}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--brand-deep);cursor:pointer;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;transition:.15s}
.sub .box{width:20px;height:20px;border-width:1.5px;font-size:12px}
.caret{width:22px;height:22px;flex:none;display:grid;place-items:center;cursor:pointer;color:var(--soft);font-size:13px;border-radius:5px;user-select:none;transition:.15s}
.caret:hover{background:rgba(102,185,177,.16);color:var(--brand-deep)}
.caret.hidden{visibility:hidden}
.subs.collapsed{display:none}
.item.done .box,.sub.done .box{background:var(--brand-deep)}
.item.done .txt,.sub.done .txt{color:var(--soft);text-decoration:line-through}
.txt{flex:1;min-width:0;font-size:17px;line-height:1.5;cursor:text;outline:none;border-radius:5px;padding:3px 4px;min-height:24px;word-break:break-word;color:var(--ink)}
.sub .txt{font-size:18px;color:var(--ink)}
.txt:focus{background:#f5f7fb;box-shadow:inset 0 0 0 1px var(--line)}
.acts{display:flex;gap:6px;flex:none;white-space:nowrap;opacity:0;transition:.2s}
.item:hover .acts,.sub:hover .acts{opacity:1}
.acts span{cursor:pointer;font-size:13px;color:var(--soft);padding:2px 4px}
.acts span:hover{color:var(--ink)}
.acts span.has{color:var(--brand-deep);font-weight:600}
.dtail{display:flex;align-items:center;gap:7px;flex:none;margin-left:10px}
.dtail .clock{display:none;font-size:14px;color:var(--brand-deep);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dtail.show .clock{display:inline}
.tbtn{border:none;background:#f0f3f8;color:var(--brand-deep);border-radius:8px;padding:6px 12px;font-size:15px;line-height:1;cursor:pointer;font-weight:600;transition:.15s;font-family:inherit;min-width:34px}
.archbtn{margin-left:auto;border:none;background:var(--brand-deep);color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;flex:none;white-space:nowrap}
.archbtn:hover{filter:brightness(1.08)}
.tbtn:hover{background:#e6ebf3}
.tbtn.run{background:var(--brand-deep);color:#fff}
.tbtn.run:hover{background:#579e96}
.tbtn.treset{background:#eef1f6;color:#9aa0ad}
.subs{list-style:none;margin:8px 0 2px 34px}
.subs:empty{display:none}
.sub{padding:4px 0;border-bottom:none}
.subin{margin:6px 0 2px 34px;display:none}
.subin.show{display:block}
.subin input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none;font-family:inherit}
.subin input:focus{border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(102,185,177,.15)}
.notein{margin:8px 0 2px 34px;display:none}
.notein.show{display:block}
.notein textarea{width:100%;min-height:52px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;line-height:1.5;outline:none;font-family:inherit;resize:vertical;color:var(--ink)}
.notein textarea:focus{border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(102,185,177,.15)}
.logsin{margin:8px 0 2px 34px}
.logsin:empty{display:none}
.loghead{font-size:12px;color:var(--soft);font-weight:600;margin-bottom:3px}
.logrow{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink);padding:2px 0;line-height:1.6}
.logrow .llabel{flex:0 0 100px;min-width:0;color:var(--brand-deep);opacity:.8;white-space:normal;word-break:break-word}
.logrow .ltime{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.logrow .ltime-dur{flex:none;white-space:nowrap}
.logrow .logdel{cursor:pointer;color:var(--soft);flex:none;font-size:12px;padding:0 4px}
.logtotal{margin-top:6px;padding:6px 0 2px;border-top:1px dashed var(--line);font-size:12.5px;font-weight:600;color:var(--brand-deep);text-align:left;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.logrow .logdel:hover{color:#e08a8a}
.pbar{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.pbar .track{flex:1;height:6px;border-radius:99px;background:#e9edf5;overflow:hidden}
.pbar .pfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-deep));transition:width .35s ease}
.pbar .ptxt{font-size:15px;color:#5FB39E;font-weight:600;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.pbar .ptime{font-size:15px;color:var(--brand-deep);font-variant-numeric:tabular-nums;font-weight:700;margin-left:10px;white-space:nowrap}
.count{margin-top:12px;text-align:center;font-size:15px;font-weight:600;color:#3E9D8C}

/* 归档 */
.arch{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 22px;margin-top:20px}
.arch-head{width:100%;display:flex;align-items:center;gap:8px;border:none;background:none;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;padding:4px 0}
.arch-head .badge{font-size:12.5px;background:rgba(102,185,177,.16);color:var(--brand-deep);border-radius:99px;padding:1px 9px;font-weight:700}
.arch-head .chev{margin-left:auto;color:var(--soft);transition:.2s;font-size:13px}
.arch.open .chev{transform:rotate(180deg)}
.arch-body{display:none;margin-top:8px;overflow:auto}
.arch.open .arch-body{display:block;height:240px}
.arch h3{font-size:13px;color:var(--soft);font-weight:600;margin:10px 0 4px}
.arch-row{display:flex;align-items:flex-start;gap:8px;padding:6px 2px 0;border-bottom:1px dashed var(--line)}
.arch-row .atxt{flex:1;min-width:0}
.arch-row .atxt .t1{font-size:14px;color:var(--ink);word-break:break-word}
.arch-row .atxt .t1.dn{text-decoration:line-through;color:var(--soft)}
.arch-row .t1row{display:grid;grid-template-columns:80px 1fr 14px;align-items:center;column-gap:4px}
.arch-row .t1row.open{display:flex;gap:8px}
.arch-row .t1row .t1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.arch-row .t1row.open .t1{text-align:left;flex:1}
.arch-row .t1row .chev2{transition:transform .2s;color:var(--soft);font-size:11px;user-select:none;text-align:center}
.arch-row .t1row.open .chev2{margin-left:auto}
.arch-row .t1row.open .chev2{transform:rotate(180deg)}
.arch-row .t1row.nrow{grid-template-columns:1fr 14px}
.arch-row .t1row.nrow.open{grid-template-columns:1fr 14px}
.arch-row .t1row.nrow .t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.arch-row .archlog{margin:6px 0 2px 0}
.arch-row .asum{display:inline;font-size:12.5px;color:#6b7280;font-variant-numeric:tabular-nums;white-space:nowrap}
.arch-row .asum .asum-dur{display:inline-block;min-width:56px;text-align:right;white-space:nowrap}
.arch-row .ameta{font-size:12px;color:var(--soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.arch-row .abtns{display:flex;gap:6px;flex:none}
.arch-row .abtns button{border:none;background:#f0f3f8;color:var(--brand-deep);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.arch-row .abtns button:hover{background:#e6ebf3}
.arch-row .abtns button.del{color:#e08a8a}
.arch-note{white-space:pre-wrap;font-size:13px;color:var(--ink);background:#f7f9fc;border-radius:9px;padding:8px 10px;margin-top:4px;max-height:120px;overflow:auto;line-height:1.6;word-break:break-word}
.arch-note-title{font-size:12px;color:var(--soft);font-weight:600;margin:5px 0 3px}
.arch-task-note{margin-top:4px}
.side-right{display:flex;align-items:center;gap:8px}
.side-bar .clr.on{background:rgba(255,255,255,.42)}
.item.active,.sub.active{background:rgba(102,185,177,.10)}
.item.active{box-shadow:inset 3px 0 0 var(--brand-deep);border-radius:11px}
.sub.active{border-radius:9px}
.grip{flex:none;width:20px;display:grid;place-items:center;cursor:grab;color:#b6bcc9;font-size:16px;line-height:1;user-select:none;opacity:1;transition:.15s}
.grip:hover{color:var(--brand-deep)}
.item:hover .grip,.sub:hover .grip{color:var(--brand-deep)}
.grip:active{cursor:grabbing}
.drop-before{box-shadow:inset 0 2px 0 0 var(--brand-deep)}
.drop-after{box-shadow:inset 0 -2px 0 0 var(--brand-deep)}
body.dragging{user-select:none;cursor:grabbing}
.arch-foot{margin-top:12px;text-align:right}
.note-back{display:inline-block;margin:2px 0 8px;border:none;background:rgba(102,185,177,.12);color:var(--brand-deep);font-family:inherit;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;transition:.15s}
.note-back:hover{background:rgba(102,185,177,.22)}
.arch-foot button{border:none;background:#fdf0f0;color:#d98a8a;border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.arch-empty{text-align:center;color:var(--soft);font-size:13px;padding:10px 0}

/* 归档提示条 */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2b2f3a;color:#fff;border-radius:12px;padding:10px 16px;font-size:13.5px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:99;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:7px;padding:4px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
#toast button:hover{background:rgba(255,255,255,.3)}

/* 随手记 */
.side-card{position:relative;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6);display:flex;flex-direction:column;height:62vh;overflow:hidden}
.side-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:linear-gradient(135deg,#8ed3cc,#66b9b1);color:#fff;font-size:15px;font-weight:600}
.side-bar .brand{display:flex;align-items:center;gap:7px}
.side-bar .clr{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:9px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.15s;width:66px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-bar .clr:hover{background:rgba(255,255,255,.35)}
.side-body{flex:1;min-height:0;padding:22px}
.side-main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.fmt-side{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:14px 7px;width:46px;flex:none;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6);overflow:auto}
.fmt-side .fmt-title{font-size:12px;color:var(--soft);font-weight:600;text-align:center;margin-bottom:2px;white-space:nowrap}
.fmt-side button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;width:100%;height:36px;padding:0;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;line-height:1;transition:.12s;display:inline-flex;align-items:center;justify-content:center}
.fmt-side button:hover{background:#eef1f6;border-color:var(--brand-deep)}
.fmt-side button.red{color:#e0533d}
.side-body .editable{width:100%;height:100%;min-height:300px;border:none;outline:none;resize:none;font-size:16px;line-height:1.8;background:transparent;color:var(--ink);font-family:inherit;white-space:pre-wrap;word-break:break-word;overflow:auto}
.side-body .editable:empty:before{content:attr(data-ph);color:#b6bdc9}
.side-body .editable .img-box{display:inline-block;position:relative;max-width:100%;vertical-align:bottom;line-height:0;margin:4px 8px 4px 0}
.side-body .editable .img-box.align-left{float:left;margin:4px 10px 6px 0}
.side-body .editable .img-box.align-right{float:right;margin:4px 0 6px 10px}
.side-body .editable .img-box.align-center{float:none;display:block;margin:8px auto}
.side-body .editable .img-box img{display:block;max-width:100%;border-radius:8px}
.side-body .editable .img-box.align-center img,.arch-note .img-box img{margin-left:auto;margin-right:auto}
.side-body .editable .img-box.align-right img{margin-left:auto;margin-right:0}
.arch-note .img-box{float:none;display:block;margin:8px 0}
.side-body .editable .img-box .align-bar{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:none;gap:2px;background:rgba(38,44,41,.82);border-radius:9px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.32);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:5}
.side-body .editable .img-box:hover .align-bar{display:flex}
.side-body .editable .img-box .al{display:flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:6px;cursor:pointer;color:#fff;transition:.12s;user-select:none}
.side-body .editable .img-box .al svg{width:16px;height:16px;display:block;pointer-events:none}
.side-body .editable .img-box .al:hover{background:rgba(255,255,255,.18)}
.side-body .editable .img-box .al.on{background:#7c9a8c;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.side-body .editable .img-box .rs{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:4px;background:rgba(124,154,140,.92);border:2px solid #fff;cursor:se-resize;display:none;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:5}
.side-body .editable .img-box:hover .rs{display:block}
.side-body .editable .img-box .del{position:absolute;right:-3px;top:-3px;width:16px;height:16px;border-radius:4px;background:rgba(193,97,97,.95);border:2px solid #fff;cursor:pointer;display:none;color:#fff;font-size:12px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.2);align-items:center;justify-content:center;font-family:inherit;z-index:6}
.side-body .editable .img-box:hover .del{display:flex}
.arch-note img{max-width:100%;border-radius:8px;margin:4px 0}
.side-body textarea::placeholder{color:#b6bdc9}

@media(max-width:820px){
  .app{flex-direction:column}
  .col.side{width:auto}
}
/* 云端同步弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(30,36,50,.45);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px)}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:24px;width:min(460px,92vw)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:10px}
.modal-tip{font-size:13px;color:var(--soft);line-height:1.6;margin-bottom:14px}
.modal-tip code{background:#f0f3f8;padding:1px 6px;border-radius:5px;font-size:12px;color:var(--ink)}
.modal-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.modal-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;font-family:inherit}
.modal-input:focus{border-color:var(--brand-deep);box-shadow:0 0 0 3px rgba(102,185,177,.15)}
.modal-row{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.modal-status{font-size:12.5px;color:var(--brand-deep);flex:1}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-btn{flex:1;min-width:120px;border:1px solid var(--line);background:#f5f7fb;color:var(--ink);border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.modal-btn:hover{background:#e6ebf3}
.modal-btn.primary{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep)}
.modal-btn.primary:hover{filter:brightness(1.06)}
.modal-btn.ghost{background:#fff;color:var(--soft)}
.modal-btn.ghost:hover{background:#f5f7fb;color:var(--ink)}
.modal-foot{font-size:11.5px;color:var(--soft);margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="col">
    <div class="list">
      <div class="list-head">
        <h2>✅ 待办清单</h2>
        <span class="io-btns"><button class="io-btn" id="btnImport" type="button">导入 .ics</button><button class="io-btn" id="btnExport" type="button">导出 .ics</button><button class="io-btn" id="btnBackup" type="button">备份</button><button class="io-btn" id="btnRestore" type="button">恢复</button><button class="io-btn" id="btnSync" type="button">☁ 同步</button></span>
      </div>
      <input class="add" id="add" placeholder="写一条任务，回车添加…">
      <ul class="items" id="items"></ul>
      <div class="count" id="count"></div>
    </div>
    <div class="arch" id="archTasks">
      <button class="arch-head" id="archTasksToggle">🗄 待办归档 <span class="badge" id="archTasksBadge">0</span><span class="chev">▾</span></button>
      <div class="arch-body" id="archTasksBody"></div>
    </div>
  </div>
  <div class="col side">
    <div class="side-main-col">
      <div class="side-card">
        <div class="side-bar"><span class="brand">🐾 随手记</span><span class="side-right"><button class="clr" id="tabMemo">备忘录</button><button class="clr" id="tabTask">对应待办</button><button class="clr" id="btnImg">插图</button><button class="clr" id="clr">清空</button></span></div>
        <div class="side-body"><div id="txt" class="editable" contenteditable="true" data-ph="想到什么写什么，自动保存…"></div></div>
      </div>
      <div class="arch" id="archNotes">
        <button class="arch-head" id="archNotesToggle">📝 随手记归档 <span class="badge" id="archNotesBadge">0</span><span class="chev">▾</span></button>
        <div class="arch-body" id="archNotesBody"></div>
      </div>
    </div>
    <div class="fmt-side" id="fmtPop">
      <div class="fmt-title">格式</div>
      <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
      <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
      <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
      <button type="button" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
      <button type="button" data-cmd="foreColor:#e0533d" title="标红" class="red">A</button>
      <button type="button" data-cmd="foreColor:#2b2f3a" title="默认色">A</button>
      <button type="button" data-cmd="removeFormat" title="清除格式">⌫</button>
    </div>
  </div>
</div>
<input type="file" id="icsFile" accept=".ics,text/calendar" style="display:none">
<input type="file" id="imgFile" accept="image/*" style="display:none">
<input type="file" id="dataFile" accept=".json,application/json" style="display:none">
<script>
/* ===== 待办清单 ===== */
const KEY='jumiao_todo_v1';
let items=load();
(function norm(list){list.forEach(n=>{if(typeof n.timeMs!=='number')n.timeMs=0;if(n.runStart)n.runStart=null;if(!Array.isArray(n.logs))n.logs=[];if(n.subs)norm(n.subs);});})(items);
const openSet=new Set(), noteSet=new Set(), collapsedSet=new Set();
let activeId=localStorage.getItem('jumiao_active_id')||null;
let drag=null;
let suppressClick=false;
function onDragMove(e){
  if(!drag)return;
  if(!drag.active){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)<5)return;
    drag.active=true;
    document.body.classList.add('dragging');
  }
  itemsEl.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=el?el.closest('.item,.sub'):null;
  if(tgt&&tgt.parentElement===drag.ul&&tgt.dataset.id!==drag.id){
    const r=tgt.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;
    tgt.classList.toggle('drop-after',after);tgt.classList.toggle('drop-before',!after);
  }
}
function onDragUp(e){
  const wasDrag=drag&&drag.active;
  if(wasDrag){
    itemsEl.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));
    document.body.classList.remove('dragging');
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tgt=el?el.closest('.item,.sub'):null;
    if(tgt&&tgt.parentElement===drag.ul&&tgt.dataset.id!==drag.id){
      const r=tgt.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;
      let beforeId;
      if(after){const nx=tgt.nextElementSibling;beforeId=nx?nx.dataset.id:null;}else beforeId=tgt.dataset.id;
      moveNode(drag.id, drag.ul, beforeId);
    }
    suppressClick=true;setTimeout(()=>suppressClick=false,0);
  }
  drag=null;
}
document.addEventListener('mousemove',onDragMove);
document.addEventListener('mouseup',onDragUp);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ===== 归档 ===== */
const AKEY='jumiao_archive_v1';
function loadArch(){try{const a=JSON.parse(localStorage.getItem(AKEY));if(a&&Array.isArray(a.tasks)&&Array.isArray(a.notes))return a;}catch{}return{tasks:[],notes:[]};}
let archive=loadArch();
function saveArch(){localStorage.setItem(AKEY,JSON.stringify(archive));}
function fmtDate(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
let toastTimer=null;
function toast(msg,btnText,onUndo){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.innerHTML='';
  const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(btnText&&onUndo){const b=document.createElement('button');b.textContent=btnText;b.addEventListener('click',()=>{onUndo();t.classList.remove('show');});t.appendChild(b);}
  t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),4500);
}

const addInput=document.getElementById('add');
const itemsEl=document.getElementById('items');
const countEl=document.getElementById('count');

function fmt(ms){
  ms=Math.max(0,ms|0);
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60,p=n=>String(n).padStart(2,'0');
  return h>0?`${h}:${p(m)}:${p(ss)}`:`${m}:${p(ss)}`;
}
function nodeTime(n){let ms=(n.timeMs||0)+(n.runStart?Date.now()-n.runStart:0);(n.subs||[]).forEach(s=>ms+=nodeTime(s));return ms;}
function computeTimes(){
  const map={};
  (function walk(list){list.forEach(n=>{let ms=(n.timeMs||0)+(n.runStart?Date.now()-n.runStart:0);(n.subs||[]).forEach(s=>{walk([s]);ms+=map[s.id];});map[n.id]=ms;});})(items);
  return map;
}
function updateTimers(){const map=computeTimes();itemsEl.querySelectorAll('.clock').forEach(el=>{const ms=map[el.dataset.timeId]||0;el.textContent='⏱ '+fmt(ms);const dt=el.closest('.dtail');if(dt)dt.classList.toggle('show',ms>0);});itemsEl.querySelectorAll('.ptime').forEach(el=>{const ms=map[el.dataset.timeId]||0;el.textContent='⏱ '+fmt(ms);});}
function foldAll(){let ch=false;(function w(list){list.forEach(n=>{if(n.runStart){const now=Date.now();n.timeMs+=now-n.runStart;const last=(n.logs||[]).filter(l=>l.end===null).pop();if(last)last.end=now;n.runStart=null;ch=true;}(n.subs&&w(n.subs));});})(items);if(ch)save();}
window.addEventListener('beforeunload',foldAll);
setInterval(updateTimers,500);

addInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&addInput.value.trim()){
    items.push({id:uid(),text:addInput.value.trim(),done:false,subs:[],note:'',timeMs:0,runStart:null,logs:[]});
    addInput.value='';save();render();
  }
});

function find(id,list=items){
  for(const n of list){
    if(n.id===id)return n;
    if(n.subs){const r=find(id,n.subs);if(r)return r;}
  }
  return null;
}
function removeNode(id,list=items){
  for(let i=0;i<list.length;i++){
    if(list[i].id===id){list.splice(i,1);return true;}
    if(list[i].subs&&removeNode(id,list[i].subs))return true;
  }
  return false;
}

function topAncestor(id){
  let found=null;
  (function walk(list,topNode){
    list.forEach(n=>{
      const t=topNode||n;
      if(n.id===id){found=t;return;}
      if(n.subs&&n.subs.length)walk(n.subs,t);
    });
  })(items,null);
  return found;
}
function listForUl(ul){
  if(ul===itemsEl)return items;
  const parentLi=ul.closest('li');
  const pnode=find(parentLi.dataset.id);
  return pnode.subs||(pnode.subs=[]);
}
function moveNode(id,ul,beforeId){
  const arr=listForUl(ul);
  let node=null;
  const ri=arr.findIndex(n=>n.id===id);
  if(ri>-1){node=arr.splice(ri,1)[0];}
  else{(function rm(list){for(let i=0;i<list.length;i++){if(list[i].id===id){node=list.splice(i,1)[0];return true;}if(list[i].subs&&rm(list[i].subs))return true;}return false;})(items);}
  if(!node)return;
  const ti=beforeId?arr.findIndex(n=>n.id===beforeId):-1;
  if(ti<0)arr.push(node);else arr.splice(ti,0,node);
  drag=null;
  save();render();
}

function taskDone(n){
  if(n.subs&&n.subs.length) return n.subs.every(s=>taskDone(s));
  return n.done;
}
function countNode(n){
  let t=1,d=taskDone(n)?1:0;
  (n.subs||[]).forEach(s=>{const c=countNode(s);t+=c.t;d+=c.d;});
  return {t,d};
}

/* 向下级联：勾选某节点时，连带把其所有子孙的 done 统一设为相同值 */
function setDeep(n,v){
  (n.subs||[]).forEach(s=>{s.done=v;setDeep(s,v);});
}

/* 计时记录单行：label 为归属标识（父任务本体传 null 时回退显示父任务名 owner.text，子任务传路径前缀）；可单条删除并重算归属节点时长 */
function buildLogRow(owner,logs,idx,label,readonly){
  const lg=logs[idx];
  const running=!lg.end;
  const dur=(lg.end||Date.now())-(lg.start||0);
  const e=document.createElement('div');e.className='logrow';
  const lab=document.createElement('span');lab.className='llabel';
  lab.textContent=label?('· '+label):('· '+(owner.text||''));
  const t=document.createElement('span');t.className='ltime';
  const sd=new Date(lg.start),ed=lg.end?new Date(lg.end):null;
  const p2=n=>String(n).padStart(2,'0');
  const sameDay=ed&&sd.getFullYear()===ed.getFullYear()&&sd.getMonth()===ed.getMonth()&&sd.getDate()===ed.getDate();
  const endStr=running?'进行中':(sameDay?p2(ed.getHours())+':'+p2(ed.getMinutes()):fmtDate(lg.end));
  const tm=document.createElement('span');tm.textContent=fmtDate(lg.start)+' → '+endStr;
  const ds=document.createElement('span');ds.className='ltime-dur';
  ds.textContent='('+fmtShort(dur)+(running?'…':'')+')';
  t.append(tm,ds);
  e.append(lab,t);
  if(!readonly){
    const x=document.createElement('span');x.className='logdel';x.textContent='✕';x.title='删除这段记录';
    x.addEventListener('click',ev=>{ev.stopPropagation();if(lg.end===null)owner.runStart=null;logs.splice(idx,1);owner.timeMs=logs.reduce((s,l)=>s+((l.end||Date.now())-(l.start||0)),0);save();render();});
    e.appendChild(x);
  }
  return e;
}
/* 生成某个节点（含所有后代）的计时记录块，归档面板用只读版 */
function buildArchiveLog(node){
  const allRows=[];
  (node.logs||[]).forEach((lg,i)=>allRows.push({owner:node,logs:node.logs,idx:i,label:null}));
  (function walk(list,prefix){
    list.forEach(n=>{
      const label=prefix?prefix+' › '+n.text:n.text;
      (n.logs||[]).forEach((lg,i)=>allRows.push({owner:n,logs:n.logs,idx:i,label}));
      if(n.subs&&n.subs.length)walk(n.subs,label);
    });
  })(node.subs||[],null);
  allRows.sort((a,b)=>a.logs[a.idx].start - b.logs[b.idx].start);
  const totalMs=nodeTime(node);
  const hasRec=allRows.length>0;
  if(!hasRec && totalMs<=0) return null;
  const wrap=document.createElement('div');wrap.className='logsin';
  const head=document.createElement('div');head.className='loghead';
  head.textContent='⏱ 计时记录 '+allRows.length+' 段';
  wrap.appendChild(head);
  if(hasRec){
    allRows.forEach(r=>wrap.appendChild(buildLogRow(r.owner,r.logs,r.idx,r.label,true)));
  }else{
    const e=document.createElement('div');e.className='logrow';
    const lab=document.createElement('span');lab.className='llabel';
    const t=document.createElement('span');t.className='ltime';
    t.textContent='历史累计计时 '+fmt(totalMs)+'（老数据无分段，重新计时即记录）';
    e.append(lab,t);wrap.appendChild(e);
  }
  const total=document.createElement('div');total.className='logtotal';
  let totalTxt='本项待办累计耗时 '+fmt(totalMs);
  if(hasRec){
    let minStart=Infinity,maxEnd=-Infinity,stillRunning=false;
    allRows.forEach(r=>{const lg=r.logs[r.idx];const s=lg.start;if(s<minStart)minStart=s;if(lg.end===null)stillRunning=true;else if(lg.end>maxEnd)maxEnd=lg.end;});
    if(isFinite(minStart))totalTxt+='\u3000\u3000· '+fmtDate(minStart)+' ~ '+(stillRunning?'进行中':(isFinite(maxEnd)?fmtDate(maxEnd):'—'));
  }
  total.textContent=totalTxt;wrap.appendChild(total);
  return wrap;
}
/* 折叠摘要用：<60秒显示「N秒」，更长用标准 fmt */
function fmtShort(ms){
  ms=Math.max(0,ms|0);
  const s=Math.floor(ms/1000);
  if(s<60)return s+' 秒';
  return fmt(ms);
}

function buildNode(node,top,path){
  const li=document.createElement('li');
  li.className=(top?'item':'sub')+(node.done?' done':'');
  li.dataset.id=node.id;
  const row=document.createElement('div');row.className='row';
  const hasSubs=(node.subs&&node.subs.length>0);
  const caret=document.createElement('span');caret.className='caret'+(hasSubs?'':' hidden');caret.textContent=collapsedSet.has(node.id)?'▶':'▼';caret.title='展开/折叠';
  caret.addEventListener('click',()=>{if(collapsedSet.has(node.id))collapsedSet.delete(node.id);else collapsedSet.add(node.id);render();});
  const box=document.createElement('div');box.className='box';box.textContent=node.done?'✓':'';
  const txt=document.createElement('div');txt.className='txt';txt.textContent=node.text;txt.contentEditable='true';
  const acts=document.createElement('div');acts.className='acts';
  const addNote=document.createElement('span');addNote.textContent='📝';addNote.title='备注';
  if(node.note&&node.note.trim())addNote.classList.add('has');
  const addSub=document.createElement('span');addSub.textContent='＋子项';addSub.title='添加子任务';
  const del=document.createElement('span');del.textContent='🗑';del.title='删除';
  acts.append(addNote,addSub,del);

  const timer=document.createElement('div');timer.className='dtail';
  const msNow=nodeTime(node), running=!!node.runStart;
  let clock=null;
  if(!top){
    clock=document.createElement('span');clock.className='clock';clock.dataset.timeId=node.id;clock.textContent='⏱ '+fmt(msNow);
    if(running||msNow>0)timer.classList.add('show');
    timer.appendChild(clock);
  }
  const tbtn=document.createElement('button');tbtn.className='tbtn'+(running?' run':'');tbtn.textContent=running?'⏹':'▶';tbtn.title=running?'结束计时':'开始计时';
  tbtn.addEventListener('click',()=>{
    if(!node.runStart){
      node.runStart=Date.now();
      (node.logs=node.logs||[]).push({start:node.runStart,end:null});
      tbtn.textContent='⏹';tbtn.classList.add('run');tbtn.title='结束计时';if(clock){clock.textContent='⏱ '+fmt(nodeTime(node));timer.classList.add('show');}
    }else{
      const now=Date.now();
      node.timeMs+=now-node.runStart;
      const last=(node.logs||[]).filter(l=>l.end===null).pop();
      if(last)last.end=now;
      node.runStart=null;tbtn.textContent='▶';tbtn.classList.remove('run');tbtn.title='开始计时';if(clock){clock.textContent='⏱ '+fmt(node.timeMs);if(node.timeMs<=0)timer.classList.remove('show');}
    }
    save();render();
  });
  const rbtn=document.createElement('button');rbtn.className='tbtn treset';rbtn.textContent='↺';rbtn.title='重置计时';
  rbtn.addEventListener('click',()=>{
    if(!confirm('重置该任务及其所有子任务的计时？'))return;
    (function clear(n){n.runStart=null;n.timeMs=0;n.logs=[];(n.subs||[]).forEach(clear);})(node);
    save();render();
  });
  timer.append(tbtn,rbtn);
  const grip=document.createElement('span');grip.className='grip';grip.textContent='⠿';grip.title='拖动排序';
  row.append(grip,caret,box,txt,timer,acts);
  li.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('.txt,textarea,input,.caret,.box,.acts,.tbtn,.treset'))return;
    e.stopPropagation();
    drag={id:node.id, ul:li.parentElement, x:e.clientX, y:e.clientY, active:false};
  });
  row.addEventListener('click',e=>{
    if(suppressClick)return;
    if(e.target.closest('.box,.caret,.acts,.tbtn,.treset,.grip'))return;
    if(activeId!==node.id)setActive(node.id);
  });
  if(top && taskDone(node)){
    const archBtn=document.createElement('button');archBtn.type='button';archBtn.className='archbtn';archBtn.textContent='🗄 归档';
    archBtn.title='归档此已完成任务';
    archBtn.addEventListener('click',ev=>{
      ev.stopPropagation();
      (function fold(x){if(x.runStart){x.timeMs+=Date.now()-x.runStart;x.runStart=null;}(x.subs||[]).forEach(fold);})(node);
      const idx=items.findIndex(it=>it.id===node.id);
      if(idx>-1)items.splice(idx,1);
      archive.tasks.unshift({node,at:Date.now()});
      if(node.note&&node.note.trim())archive.notes.unshift({id:uid(),at:Date.now(),text:node.note,title:node.text,taskId:node.id});
      save();saveArch();render();renderTaskArchive();renderNoteArchive();
      if(activeId===node.id)setActive(null);
      toast('🗄 已归档「'+(node.text||'').slice(0,18)+'」'+(node.note&&node.note.trim()?' 及其随手记':''));
    });
    row.appendChild(archBtn);
  }

  const subs=document.createElement('ul');subs.className='subs'+(collapsedSet.has(node.id)?' collapsed':'');
  (node.subs||[]).forEach((s,j)=>subs.appendChild(buildNode(s,false,[...path,j+1])));


  const subin=document.createElement('div');subin.className='subin'+((openSet.has(node.id)&&!collapsedSet.has(node.id))?' show':'');
  const sin=document.createElement('input');sin.placeholder='子任务，回车添加…';
  subin.appendChild(sin);
  sin.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&sin.value.trim()){
      node.subs=node.subs||[];
      node.subs.push({id:uid(),text:sin.value.trim(),done:false,subs:[],note:'',timeMs:0,runStart:null,logs:[]});
      sin.value='';save();render();focusEl(node.id,'.subin input');
    }
  });
  addSub.addEventListener('click',()=>{
    if(openSet.has(node.id))openSet.delete(node.id);else openSet.add(node.id);
    render();if(openSet.has(node.id))focusEl(node.id,'.subin input');
  });

  const notein=document.createElement('div');notein.className='notein'+(noteSet.has(node.id)?' show':'');
  const note=document.createElement('textarea');note.placeholder='写点备注…（截止时间、细节、参考链接等）';note.value=node.note||'';
  notein.appendChild(note);
  note.addEventListener('input',()=>{node.note=note.value;save();if(node.note.trim())addNote.classList.add('has');else addNote.classList.remove('has');});
  addNote.addEventListener('click',()=>{
    if(noteSet.has(node.id))noteSet.delete(node.id);else noteSet.add(node.id);
    render();if(noteSet.has(node.id))focusEl(node.id,'.notein textarea');
  });

  const logsin=document.createElement('div');logsin.className='logsin';
  if(top){
    // 收集所有计时记录行（本体 + 所有后代），保留起始时间用于排序
    const allRows=[];
    (node.logs||[]).forEach((lg,i)=>allRows.push({owner:node,logs:node.logs,idx:i,label:null}));
    (function walk(list,prefix){
      list.forEach(n=>{
        const label=prefix?prefix+' › '+n.text:n.text;
        (n.logs||[]).forEach((lg,i)=>allRows.push({owner:n,logs:n.logs,idx:i,label}));
        if(n.subs&&n.subs.length)walk(n.subs,label);
      });
    })(node.subs||[],null);
    allRows.sort((a,b)=>a.logs[a.idx].start - b.logs[b.idx].start); // 按开始时间升序依次排列
    const totalMs=nodeTime(node);
    const hasRec=allRows.length>0;
    if(hasRec||totalMs>0){
      const head=document.createElement('div');head.className='loghead';
      head.textContent='⏱ 计时记录 '+allRows.length+' 段';
      logsin.appendChild(head);
      if(hasRec){
        allRows.forEach(r=>logsin.appendChild(buildLogRow(r.owner,r.logs,r.idx,r.label)));
      }else{
        const e=document.createElement('div');e.className='logrow';
        const lab=document.createElement('span');lab.className='llabel';
        const t=document.createElement('span');t.className='ltime';
        t.textContent='历史累计计时 '+fmt(totalMs)+'（老数据无分段，重新计时即记录）';
        e.append(lab,t);logsin.appendChild(e);
      }
      const total=document.createElement('div');total.className='logtotal';
      let totalTxt='本项待办累计耗时 '+fmt(totalMs);
      if(hasRec){
        let minStart=Infinity,maxEnd=-Infinity,stillRunning=false;
        allRows.forEach(r=>{const lg=r.logs[r.idx];const s=lg.start;if(s<minStart)minStart=s;if(lg.end===null)stillRunning=true;else if(lg.end>maxEnd)maxEnd=lg.end;});
        if(isFinite(minStart))totalTxt+='\u3000\u3000· '+fmtDate(minStart)+' ~ '+(stillRunning?'进行中':(isFinite(maxEnd)?fmtDate(maxEnd):'—'));
      }
      total.textContent=totalTxt;
      logsin.appendChild(total);
    }
  }

  let pbarEl=null;
  if(top){
    const c=countNode(node);
    const pct=c.t?Math.round(c.d/c.t*100):0;
    pbarEl=document.createElement('div');pbarEl.className='pbar';
    const track=document.createElement('div');track.className='track';
    const pfill=document.createElement('div');pfill.className='pfill';pfill.style.width=pct+'%';
    track.appendChild(pfill);
    const ptxt=document.createElement('span');ptxt.className='ptxt';ptxt.textContent=pct+'%';
    const ptime=document.createElement('span');ptime.className='ptime';ptime.dataset.timeId=node.id;ptime.textContent='⏱ '+fmt(nodeTime(node));
    pbarEl.append(track,ptxt,ptime);
  }
  li.append(...(pbarEl?[pbarEl]:[]), row, subs,subin,notein,logsin);
  box.addEventListener('click',()=>{
    node.done=!node.done;
    setDeep(node,node.done);
    save();render();
  });
  txt.addEventListener('blur',()=>{const v=txt.textContent.trim();if(v!==node.text){node.text=v;if(!v)removeNode(node.id);save();render();}});
  txt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();txt.blur();}});
  del.addEventListener('click',()=>{removeNode(node.id);if(activeId===node.id)setActive(null);save();render();});
  return li;
}
function focusEl(id,sel){const t=itemsEl.querySelector('[data-id="'+id+'"] '+sel);if(t)t.focus();}

function setActive(id){
  activeId=id||null;
  try{localStorage.setItem('jumiao_active_id',activeId||'');}catch{}
  const node=id?find(id):null;
  const owner=node?topAncestor(id):null;
  sTxt.innerHTML=owner?(owner.note||''):(localStorage.getItem('jumiao_float')||'');
  wrapImages(sTxt);
  sTxt.setAttribute('data-ph',owner?('写点关于「'+(owner.text||'这条待办')+'」的随手记…'):'想到什么写什么，自动保存…');
  tabTask.textContent=node?(owner?owner.text:'对应待办'):'对应待办';
  tabMemo.classList.toggle('on',!node);
  tabTask.classList.toggle('on',!!node);
  itemsEl.querySelectorAll('.item.active,.sub.active').forEach(el=>el.classList.remove('active'));

function countAll(list){

  list.forEach(n=>{t++;if(taskDone(n))d++;(n.subs||[]).forEach(s=>{const c=countAll([s]);t+=c.t;d+=c.d;});});
  return {t,d};
}
function updateCount(){

function insertNodeAtCaret(node){

  const sel=window.getSelection();if(sel){sel.removeAllRanges();sel.addRange(r);}
  saveNote();

/* ===== .ics 与苹果日历/提醒事项互导 ===== */
function parseICS(text){
  const unfolded=text.replace(/\r\n/g,'\n').replace(/\n[ \t]/g,m=>m.slice(1));
  const re=/BEGIN:(VTODO|VEVENT)([\s\S]*?)END:\1/g;
  const comps=[];let m;
  while((m=re.exec(unfolded))){
    const body=m[2];const props={};
    body.split('\n').forEach(line=>{
      if(!line.trim())return;
      const ci=line.indexOf(':');if(ci<0)return;
      const key=line.slice(0,ci).split(';')[0].trim().toUpperCase();
      let val=line.slice(ci+1).replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
      (props[key]=props[key]||[]).push(val);
    });
    comps.push({type:m[1],props});
  }
  return comps.map(o=>{
    const summary=(o.props['SUMMARY']&&o.props['SUMMARY'][0])||'(无标题)';
    const desc=(o.props['DESCRIPTION']&&o.props['DESCRIPTION'][0])||'';
    let done=false;
    if(o.type==='VTODO'){
      const st=(o.props['STATUS']&&o.props['STATUS'][0]||'').toUpperCase();
      const pct=o.props['PERCENT-COMPLETE']&&parseInt(o.props['PERCENT-COMPLETE'][0],10);
      if(st==='COMPLETED'||pct===100)done=true;
    }
    return {id:uid(),text:summary,done,subs:[],note:desc,timeMs:0,runStart:null,logs:[]};
  });
}
function escapeICS(v){return (v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function icsStamp(){return 'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');}
function exportICS(){
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Jumiao Workbench//ZH\r\nCALSCALE:GREGORIAN\r\n';
  (function walk(list){
    list.forEach(n=>{
      s+='BEGIN:VTODO\r\nUID:'+(n.id||uid())+'@jumiao\r\n';
      s+='SUMMARY:'+escapeICS(n.text)+'\r\n';
      if(n.note)s+='DESCRIPTION:'+escapeICS(n.note)+'\r\n';
      s+='STATUS:'+(n.done?'COMPLETED':'NEEDS-ACTION')+'\r\n';
      if(n.done)s+='COMPLETED:'+icsStamp().slice(7)+'\r\n';
      s+=icsStamp()+'\r\n';
      s+='END:VTODO\r\n';
      if(n.subs&&n.subs.length)walk(n.subs);
    });
  })(items);
  s+='END:VCALENDAR';
  const blob=new Blob([s],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='工作台待办.ics';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function importICS(text){
  const nodes=parseICS(text);
  if(!nodes.length){toast('📥 没解析到待办/事件');return;}
  items.unshift(...nodes);
  save();render();
  toast('📥 已导入 '+nodes.length+' 条（待办/事件）');
}
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('icsFile').click());
document.getElementById('icsFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{importICS(String(r.result||''));}catch(err){toast('📥 导入失败：'+err.message);}e.target.value='';};
  r.readAsText(f);
});
document.getElementById('btnExport').addEventListener('click',exportICS);

/* ===== 整库备份 / 恢复（换电脑搬家用） ===== */
function backupData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('jumiao_'))data[k]=localStorage.getItem(k);
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='工作台数据备份.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('💾 已导出全部数据备份');
}
function restoreData(text){
  let data;
  try{data=JSON.parse(text);}catch(e){toast('恢复失败：文件不是有效 JSON');return;}
  const obj=Array.isArray(data)?Object.fromEntries(data):data;
  let n=0;
  Object.entries(obj).forEach(([k,v])=>{if(k&&k.startsWith('jumiao_')&&typeof v==='string'){localStorage.setItem(k,v);n++;}});
  if(!n){toast('恢复失败：备份里没有工作台数据');return;}
  toast('💾 已恢复 '+n+' 项数据，正在重新加载…');
  setTimeout(()=>{if(location.reload)location.reload();else setActive(activeId);},600);
}
document.getElementById('btnBackup').addEventListener('click',backupData);
document.getElementById('btnRestore').addEventListener('click',()=>document.getElementById('dataFile').click());
document.getElementById('dataFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{restoreData(String(r.result||''));}catch(err){toast('恢复失败：'+err.message);}e.target.value='';};
  r.readAsText(f);
});
/* ===== 云端同步（GitHub 私有仓库，档位①） ===== */
const SYNC_OWNER='miaowuya';
const SYNC_REPO='workbench-data';
const SYNC_PATH='workbench-data.json';
const SYNC_TOKEN_KEY='jumiao_sync_token';
function getSyncToken(){return localStorage.getItem(SYNC_TOKEN_KEY)||'';}
function setSyncToken(t){if(t)localStorage.setItem(SYNC_TOKEN_KEY,t);else localStorage.removeItem(SYNC_TOKEN_KEY);}
function collectLocalData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('jumiao_'))data[k]=localStorage.getItem(k);}
  return data;
}
function b64encodeUtf8(str){return btoa(unescape(encodeURIComponent(str)));}
function b64decodeUtf8(b64){return decodeURIComponent(escape(atob(b64.replace(/\s/g,''))));}
function computeDataHash(data){
  const s=JSON.stringify(data||{});
  let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}
  return h.toString(36);
}
async function ghGetFile(token){
  const url=`https://api.github.com/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_PATH}`;
  const res=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
  if(res.status===404)return null;
  const j=await res.json();
  if(res.status>=400)throw new Error(j.message||'读取云端失败');
  return {content:JSON.parse(b64decodeUtf8(j.content)),sha:j.sha};
}
async function ghPutFile(token,dataObj,sha){
  const body={message:'sync workbench '+new Date().toISOString(),content:b64encodeUtf8(JSON.stringify(dataObj,null,2))};
  if(sha)body.sha=sha;
  const res=await fetch(`https://api.github.com/repos/${SYNC_OWNER}/${SYNC_REPO}/contents/${SYNC_PATH}`,{
    method:'PUT',
    headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const j=await res.json();
  if(res.status>=400)throw new Error(j.message||'上传云端失败');
  return j;
}
async function doUpload(){
  const token=getSyncToken();
  const data=collectLocalData();
  let sha=null;
  try{const f=await ghGetFile(token);if(f)sha=f.sha;}catch(e){/* 云端无文件，首次创建 */}
  await ghPutFile(token,data,sha);
  localStorage.setItem('jumiao_sync_at',Date.now());
  localStorage.setItem('jumiao_sync_hash',computeDataHash(data));
  updateSyncStatus();
}
async function pushToCloud(){
  const token=getSyncToken();
  if(!token){toast('请先在同步弹窗里保存令牌');return;}
  try{
    toast('☁ 正在上传…');
    await doUpload();
    const data=collectLocalData();
    toast('☁ 已上传到云端（'+Object.keys(data).length+' 项）');
  }catch(e){toast('上传失败：'+e.message);}
}
// 自动同步：仅自动上传（绝不自动下载，避免覆盖本机数据）
async function autoSyncIfChanged(){
  const token=getSyncToken();
  if(!token)return;
  const data=collectLocalData();
  const h=computeDataHash(data);
  const last=localStorage.getItem('jumiao_sync_hash');
  if(last===h)return; // 无改动则跳过，避免无意义地刷 GitHub 提交记录
  try{await doUpload();}
  catch(e){/* 静默失败，下次定时再试 */}
}
let autoSyncStarted=false;
function startAutoSync(){
  if(autoSyncStarted)return;
  if(!getSyncToken())return;
  autoSyncStarted=true;
  setTimeout(autoSyncIfChanged,3000);       // 打开页面后若有改动，3秒补传一次
  setInterval(autoSyncIfChanged,3600000);   // 之后每1小时检查并上传
}
async function pullFromCloud(){
  const token=getSyncToken();
  if(!token){toast('请先在同步弹窗里保存令牌');return;}
  try{
    toast('☁ 正在下载…');
    const f=await ghGetFile(token);
    if(!f){toast('云端还没有数据，请先上传');return;}
    if(!confirm('从云端下载会覆盖本机当前数据。\\n建议先点"备份"留底。确定继续下载？'))return;
    backupData(); // 覆盖前先导出一份本地备份留底
    Object.entries(f.content).forEach(([k,v])=>{if(k&&k.startsWith('jumiao_')&&typeof v==='string')localStorage.setItem(k,v);});
    localStorage.setItem('jumiao_sync_at',Date.now());
    toast('☁ 已从云端下载，正在重新加载…');
    setTimeout(()=>location.reload(),600);
  }catch(e){toast('下载失败：'+e.message);}
}
const syncMask=document.getElementById('syncMask');
const syncTokenInput=document.getElementById('syncToken');
function openSync(){syncTokenInput.value=getSyncToken();updateSyncStatus();syncMask.classList.add('show');}
function closeSync(){syncMask.classList.remove('show');}
function updateSyncStatus(){
  const at=localStorage.getItem('jumiao_sync_at');
  const st=document.getElementById('syncStatus');
  st.textContent=at?('上次同步：'+new Date(+at).toLocaleString()):'尚未同步';
  const auto=document.getElementById('syncAuto');
  if(auto)auto.textContent=getSyncToken()?'🔄 自动同步：每1小时（已开启，仅自动上传）':'未开启（先保存令牌）';
}
document.getElementById('btnSync').addEventListener('click',openSync);
document.getElementById('syncClose').addEventListener('click',closeSync);
syncMask.addEventListener('click',e=>{if(e.target===syncMask)closeSync();});
document.getElementById('syncSaveToken').addEventListener('click',()=>{
  const t=syncTokenInput.value.trim();
  if(!t){toast('请输入令牌');return;}
  setSyncToken(t);updateSyncStatus();toast('✅ 令牌已保存（仅本机）');startAutoSync();
});
document.getElementById('syncPush').addEventListener('click',pushToCloud);
document.getElementById('syncPull').addEventListener('click',pullFromCloud);
startAutoSync(); // 若已保存令牌，打开页面即开始每小时自动上传
</script>
<!-- 云端同步弹窗 -->
<div class="modal-mask" id="syncMask">
  <div class="modal">
    <div class="modal-title">☁ 云端同步</div>
    <p class="modal-tip">数据存到你的私有仓库 <code>miaowuya/workbench-data</code>（GitHub 云端，不公开）。在电脑和手机打开同一个工作台网址，登录同一令牌即可双向同步。</p>
    <label class="modal-label">GitHub 访问令牌 (PAT)</label>
    <input class="modal-input" id="syncToken" type="password" placeholder="粘贴 ghp_... 令牌（需 repo 权限）" autocomplete="off">
    <div class="modal-row">
      <button class="modal-btn" id="syncSaveToken" type="button">保存令牌</button>
      <span class="modal-status" id="syncStatus"></span>
    </div>
    <div id="syncAuto" style="font-size:12px;color:#6b7280;margin:2px 0 8px"></div>
    <div class="modal-actions">
      <button class="modal-btn primary" id="syncPush" type="button">⬆ 上传到云端</button>
      <button class="modal-btn" id="syncPull" type="button">⬇ 下载到本机</button>
      <button class="modal-btn ghost" id="syncClose" type="button">关闭</button>
    </div>
    <p class="modal-foot">令牌只保存在本机浏览器（localStorage），不上传任何服务器。</p>
  </div>
</div>
